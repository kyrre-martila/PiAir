[package]
name = "piair"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless PiAir ALSA capture, audio activity and passive receiver discovery"
repository = "https://github.com/kyrre-martila/PiAir"

[dependencies]
alsa = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
mdns-sd = { version = "=0.13.11", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
srp = "0.6"
num-bigint = "0.4"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
tempfile = "3"
rustix = { version = "1", features = ["process"] }
