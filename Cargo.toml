[package]
name = "piair"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless PiAir configuration and passive receiver discovery"
repository = "https://github.com/kyrre-martila/PiAir"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mdns-sd = "=0.13.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
