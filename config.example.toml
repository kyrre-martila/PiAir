# Receiver discovery timeout; bounded to 1..60 seconds, plus up to 1s shutdown.
discovery_timeout_secs = 5

# Explicit approval only; copy a canonical device ID from `piair devices`.
# Example: ["device:aabbccddeeff"]. Advertised IDs are not authenticated identities.
# Empty means deny every future connection. No receiver is selected by discovery.
receiver_allowlist = []

[audio]
# Prefer a stable USB card identifier from 'audio devices' / 'arecord -l'.
device = "default"
sample_rate = 48000
channels = 2
window_ms = 20
# Provisional: calibrate with the source stopped, then test quiet music.
start_threshold_dbfs = -45.0
stop_threshold_dbfs = -55.0
start_duration_ms = 200
stop_duration_ms = 5000
pre_roll_ms = 1000
calibration_duration_secs = 30

# Automatic AirPlay playback: the installed service (`piair start`).
# Foreground `piair run --allow-unattended` needs explicit PTP port permission;
# see docs/PTP_PORT_PERMISSIONS.md. No privileges are granted by configuration.
# [audio] above remains independent and controls monitor/calibration only.
# No receiver, capture device or authentication profile is inferred by run.
# Set these with `piair config set-playback ...` after approval and selection.
[playback]
# capture_device = "plughw:CARD=CODEC,DEV=0" # Example Behringer UCA202, verify locally
# receiver_id = "device:0123456789ab" # Placeholder: replace with approved selected HomePod ID
# authentication = "own-tone-transient" # Requires explicit --method transient selection
# Alternatively "stored-hap" uses existing enrolled HAP credentials.
# These numeric defaults retain the previous automatic runtime behavior; they
# are examples to verify locally, not universal hardware recommendations.
threshold_dbfs = -45.0
start_duration_ms = 1000
stop_duration_ms = 30000
# volume_db = -20 # Optional -60..=-10 integer dB; may persist on the receiver
