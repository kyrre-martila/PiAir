name: Rust
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - cargo fmt --all -- --check
          - cargo clippy --locked --all-targets -- -D warnings
          - cargo test --locked
          - cargo build --release --locked
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install ALSA build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: ${{ matrix.command }}
      - name: Check committed dependency resolution
        run: git diff --exit-code -- Cargo.lock

  # Native ARM64 packaging and Bookworm runtime checks live in release.yml.

  systemd:
    name: Systemd service contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate service and standalone capability helper
        run: |
          command -v systemd-analyze
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Exercise clean installation and rollback against the running system manager
        run: sudo env PIAIR_SYSTEMD_INSTALL_TEST=1 SUDO_UID="$(id -u)" python3 -m unittest discover -s scripts -p test_first_install_systemd.py
